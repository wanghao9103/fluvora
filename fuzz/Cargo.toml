[package]
name = "fluvora-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fluvora-stun = { path = "../crates/webrtc/stun" }
fluvora-rtp = { path = "../crates/webrtc/rtp" }
fluvora-data-channel = { path = "../crates/webrtc/data-channel" }
libfuzzer-sys = "0.4"

[[bin]]
name = "stun_message"
path = "fuzz_targets/stun_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_packet"
path = "fuzz_targets/rtp_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_channel_packet"
path = "fuzz_targets/data_channel_packet.rs"
test = false
doc = false
bench = false
