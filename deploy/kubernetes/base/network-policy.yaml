apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluvora-service-network
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-api
spec:
  podSelector:
    matchLabels:
      app: fluvora-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-media-gateway
spec:
  podSelector:
    matchLabels:
      app: fluvora-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-webrtc-media
spec:
  podSelector:
    matchLabels:
      app: fluvora-media-node
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 50000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-turn
spec:
  podSelector:
    matchLabels:
      app: fluvora-turn
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 3478
        - protocol: TCP
          port: 3478
        - protocol: TCP
          port: 5349
        - protocol: UDP
          port: 49152
          endPort: 49251
