apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvora-status
spec:
  replicas: 2
  selector:
    matchLabels: {app: fluvora-status}
  template:
    metadata:
      labels: {app: fluvora-status}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8090"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: fluvora-status}
      containers:
        - name: status
          image: ghcr.io/fluvora/fluvora
          command: [fluvora-status-service]
          envFrom:
            - configMapRef: {name: fluvora-config}
            - secretRef: {name: fluvora-secrets}
          ports:
            - {name: http, containerPort: 8090}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, failureThreshold: 30}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: fluvora-status
spec:
  selector: {app: fluvora-status}
  ports:
    - {name: http, port: 8090, targetPort: http}
