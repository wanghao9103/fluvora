apiVersion: v1
kind: Secret
metadata:
  name: fluvora-secrets
  namespace: fluvora
type: Opaque
stringData:
  FLUVORA_TOKEN_SECRETS: "replace-active-key-at-least-32-bytes,replace-retiring-key-at-least-32-bytes"
  FLUVORA_GIFT_WEBHOOK_SECRET: "replace-with-at-least-32-random-bytes"
  FLUVORA_MEDIA_CONTROL_TOKEN: "replace-media-control-token"
  FLUVORA_GATEWAY_TOKEN: "replace-gateway-control-token"
  FLUVORA_WORKER_TOKEN: "replace-worker-control-token"
  FLUVORA_STATUS_TOKEN: "replace-status-heartbeat-token"
  FLUVORA_TURN_USERNAME: "fluvora"
  FLUVORA_TURN_PASSWORD: "replace-static-turn-password"
  FLUVORA_TURN_REALM: "turn.example.com"
  FLUVORA_TURN_NONCE_SECRET: "replace-with-at-least-32-random-bytes"
  FLUVORA_TURN_REST_SECRET: "replace-with-at-least-32-random-bytes"
  FLUVORA_DTLS_FINGERPRINT: "REPLACE:WITH:SHA256:CERTIFICATE:FINGERPRINT"
  FLUVORA_DATABASE_URL: "postgresql://fluvora:REPLACE_PASSWORD@postgres.example.com:5432/fluvora?sslmode=require"
  FLUVORA_NATS_TOKEN: "replace-with-at-least-24-random-bytes"
  # Omit these two keys when workload identity supplies S3 credentials.
  FLUVORA_OBJECT_STORE_ACCESS_KEY: "replace-object-store-access-key"
  FLUVORA_OBJECT_STORE_SECRET_KEY: "replace-object-store-secret-key"
