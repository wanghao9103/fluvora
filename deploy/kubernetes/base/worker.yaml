apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvora-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: fluvora-worker}
  template:
    metadata:
      labels: {app: fluvora-worker}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8091"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: fluvora-worker}
      containers:
        - name: worker
          image: ghcr.io/fluvora/fluvora
          command: [fluvora-media-worker]
          envFrom:
            - configMapRef: {name: fluvora-config}
            - secretRef: {name: fluvora-secrets}
          env:
            - name: FLUVORA_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: FLUVORA_CONTROL_ADVERTISE_URL
              value: "http://$(POD_IP):8091"
          ports:
            - {name: http, containerPort: 8091}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, failureThreshold: 60}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fluvora-data}
---
apiVersion: v1
kind: Service
metadata:
  name: fluvora-worker
spec:
  selector: {app: fluvora-worker}
  ports:
    - {name: http, port: 8091, targetPort: http}
