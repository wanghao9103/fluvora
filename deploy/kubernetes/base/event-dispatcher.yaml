apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvora-event-dispatcher
spec:
  replicas: 2
  selector:
    matchLabels: {app: fluvora-event-dispatcher}
  template:
    metadata:
      labels: {app: fluvora-event-dispatcher}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8095"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: fluvora-event-dispatcher}
      containers:
        - name: event-dispatcher
          image: ghcr.io/fluvora/fluvora
          command: [fluvora-event-dispatcher]
          envFrom:
            - configMapRef: {name: fluvora-config}
            - secretRef: {name: fluvora-secrets}
          env:
            - name: FLUVORA_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8095}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, failureThreshold: 30}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fluvora-event-dispatcher
spec:
  selector: {app: fluvora-event-dispatcher}
  ports:
    - {name: http, port: 8095, targetPort: http}
