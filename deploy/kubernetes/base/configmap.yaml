apiVersion: v1
kind: ConfigMap
metadata:
  name: fluvora-config
data:
  FLUVORA_BUILD_VERSION: "0.1.0"
  FLUVORA_REGION: "default"
  FLUVORA_STATUS_URL: "http://fluvora-status:8090"
  FLUVORA_STATUS_ALLOW_INSECURE: "true"
  FLUVORA_API_BIND: "0.0.0.0:8080"
  FLUVORA_STATUS_BIND: "0.0.0.0:8090"
  FLUVORA_EVENT_DISPATCHER_BIND: "0.0.0.0:8095"
  FLUVORA_NATS_URL: "tls://nats.example.com:4222"
  FLUVORA_EVENT_STREAM: "FLUVORA_EVENTS"
  FLUVORA_EVENT_SUBJECT: "fluvora.events"
  FLUVORA_EVENT_BATCH_SIZE: "100"
  FLUVORA_EVENT_CLAIM_TTL_MILLIS: "30000"
  FLUVORA_EVENT_POLL_MILLIS: "100"
  FLUVORA_WORKER_BIND: "0.0.0.0:8091"
  FLUVORA_MEDIA_CONTROL_BIND: "0.0.0.0:8092"
  FLUVORA_MEDIA_UDP_BIND: "0.0.0.0:50000"
  FLUVORA_MEDIA_MAX_SESSIONS: "10000"
  FLUVORA_GATEWAY_BIND: "0.0.0.0:8093"
  FLUVORA_TURN_BIND: "0.0.0.0:3478"
  FLUVORA_TURN_TLS_BIND: "0.0.0.0:5349"
  FLUVORA_TURN_STATUS_BIND: "0.0.0.0:8094"
  FLUVORA_MEDIA_CONTROL_URL: "http://fluvora-media-node:8092"
  FLUVORA_WORKER_URL: "http://fluvora-worker:8091"
  FLUVORA_GATEWAY_URL: "http://fluvora-gateway:8093"
  FLUVORA_PUBLIC_MEDIA_BASE_URL: "https://media.example.com"
  FLUVORA_CORS_ORIGINS: "https://app.example.com"
  FLUVORA_ICE_CANDIDATE: "1 1 UDP 2130706431 REPLACE_PUBLIC_IP 50000 typ host"
  FLUVORA_ICE_URLS: "stun:REPLACE_PUBLIC_IP:3478,turn:REPLACE_PUBLIC_IP:3478?transport=udp,turn:REPLACE_PUBLIC_IP:3478?transport=tcp,turns:REPLACE_PUBLIC_IP:5349?transport=tcp"
  FLUVORA_TURN_ADVERTISED_IP: "REPLACE_PUBLIC_IP"
  FLUVORA_TURN_RELAY_BIND_IP: "0.0.0.0"
  FLUVORA_TURN_RELAY_PORT_MIN: "49152"
  FLUVORA_TURN_RELAY_PORT_MAX: "49251"
  FLUVORA_TURN_ALLOW_PRIVATE_PEERS: "false"
  FLUVORA_TURN_MAX_RELAY_BYTES_PER_SECOND: "5000000"
  FLUVORA_TURN_MAX_ALLOCATIONS: "100"
  FLUVORA_TURN_MAX_ALLOCATIONS_PER_IP: "16"
  FLUVORA_WORKER_CONCURRENCY: "4"
  FLUVORA_FFMPEG: "ffmpeg"
  FLUVORA_FFPROBE: "ffprobe"
  FLUVORA_TRANSCODE_GLOBAL_JOBS: "128"
  FLUVORA_TRANSCODE_TENANT_JOBS: "16"
  FLUVORA_WORKER_INPUT_ROOT: "/data/input"
  FLUVORA_WORKER_OUTPUT_ROOT: "/data/output"
  FLUVORA_WORKER_LIVE_ROOT: "/data/live"
  FLUVORA_WORKER_STATE_ROOT: "/data/worker-state"
  FLUVORA_STORAGE_ROOT: "/data"
  FLUVORA_OBJECT_STORE_BUCKET: "REPLACE_MEDIA_BUCKET"
  FLUVORA_OBJECT_STORE_REGION: "us-east-1"
  FLUVORA_OBJECT_STORE_PREFIX: "fluvora"
  FLUVORA_OBJECT_STORE_ALLOW_HTTP: "false"
  FLUVORA_VOD_RETENTION_HOURS: "720"
  FLUVORA_LIVE_RETENTION_HOURS: "24"
  FLUVORA_RETENTION_INTERVAL_SECONDS: "900"
  FLUVORA_STATE_DIR: "/data/control"
  FLUVORA_DATABASE_MAX_CONNECTIONS: "16"
  FLUVORA_DTLS_CERT_PEM: "/certs/tls.crt"
  FLUVORA_DTLS_KEY_PEM: "/certs/tls.key"
  FLUVORA_TURN_TLS_CERT: "/certs/tls.crt"
  FLUVORA_TURN_TLS_KEY: "/certs/tls.key"
