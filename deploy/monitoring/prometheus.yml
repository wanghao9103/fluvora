global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fluvora-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: fluvora-status
    static_configs:
      - targets: ["status:8090"]
  - job_name: fluvora-event-dispatcher
    static_configs:
      - targets: ["event-dispatcher:8095"]
  - job_name: fluvora-media-node
    static_configs:
      - targets: ["media-node:8092"]
  - job_name: fluvora-media-worker
    static_configs:
      - targets: ["worker:8091"]
  - job_name: fluvora-media-gateway
    static_configs:
      - targets: ["gateway:8093"]
  - job_name: fluvora-turn
    static_configs:
      - targets: ["turn:8094"]
