name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pkg-config
      - name: Rust format, lint and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo clippy -p fluvora-media-node --features openssl-backend --all-targets -- -D warnings
          cargo test -p fluvora-dtls-adapter --features openssl-backend --locked
      - name: Build and link native SDK demos
        run: |
          cargo build -p fluvora-sdk --example room_client --locked
          cargo build -p fluvora-c-abi --locked
          cmake -S sdk/c-abi/examples -B target/c-demo \
            -DFLUVORA_LIBRARY_DIR="${GITHUB_WORKSPACE}/target/debug"
          cmake --build target/c-demo
      - name: Real FFmpeg VOD and live HLS smoke
        shell: pwsh
        run: |
          cargo build -p fluvora-media-worker --locked
          ./scripts/smoke-hls-pipelines.ps1
      - name: Real TURN UDP, TCP and TLS relay smoke
        shell: pwsh
        run: |
          cargo build -p fluvora-turn-server --bins --locked
          ./scripts/smoke-turn.ps1 -EvidenceDirectory artifacts/turn-smoke
      - name: Web SDK and cross-SDK contract
        working-directory: sdk/web
        run: |
          npm ci
          node ../../scripts/check-sdk-contract.mjs
          node ../../scripts/check-sdk-demos.mjs
          npm run check
          npm test
          npm run build
      - name: Capacity performance gate
        run: cargo run --release --locked -p fluvora-perf-lab -- --assert
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  verify-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/web/package-lock.json
            tests/browser/package-lock.json
      - name: Build native WebRTC services
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 libssl-dev pkg-config
          cargo build -p fluvora-api-server -p fluvora-admin
          cargo build -p fluvora-media-node --features openssl-backend
      - working-directory: sdk/web
        run: npm ci && npm run build
      - working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Browser interoperability
        run: bash scripts/run-browser-interop.sh
      - name: Weak-network Chromium interoperability
        env:
          FLUVORA_NETEM: "true"
          FLUVORA_SKIP_LOAD: "true"
          FLUVORA_BROWSER_PROJECT: chromium
        run: bash scripts/run-browser-interop.sh

  verify-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.4.1"
      - working-directory: sdk/android
        run: >
          gradle --no-daemon
          :fluvora:testDebugUnitTest
          :fluvora:assembleRelease
          :demo:assembleDebug

  verify-swift:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: swift test --package-path sdk/ios
      - run: swift build --package-path sdk/ios --product fluvora-swift-demo
      - name: Build iOS Simulator demo app
        run: >
          xcodebuild
          -project sdk/ios/Examples/FluvoraDemoApp/FluvoraDemoApp.xcodeproj
          -scheme FluvoraDemoApp
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  image:
    needs: [verify-core, verify-browser, verify-android, verify-swift]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Resolve image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: fluvora.spdx.json
          artifact-name: fluvora-${{ github.ref_name }}.spdx.json
          upload-release-assets: false
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
